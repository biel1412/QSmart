name: Publicar no GitHub Pages

# Compila o QSmart (Blazor WebAssembly) e publica o site pronto na branch gh-pages.
# No GitHub: Settings → Pages → Source: "Deploy from a branch" → gh-pages / (root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    name: Compilar e publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Compilar o QSmart
        run: dotnet publish src/QSmart.Web/QSmart.Web.csproj -c Release -o publicado

      - name: Ajustar para o GitHub Pages
        run: |
          cd publicado/wwwroot
          REPO="${GITHUB_REPOSITORY#*/}"
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO}/\" />|" index.html
          cp index.html 404.html          # rotas internas (ex.: /resumo) abrem direto
          touch .nojekyll                 # sem isso o GitHub Pages esconde a pasta _framework

      - name: Publicar na branch gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd publicado/wwwroot
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicação de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
